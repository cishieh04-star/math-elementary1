<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>火車加減法遊戲(加減2或3)</title>
    <style>
        body { 
            background-color: #e0f7fa; margin: 0; padding: 2vh; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; 
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }
        
        /* 💡 保持原介面風格，並加入內部捲動與適當內距，確保在所有裝置上都能看到全貌 */
        #home-screen { 
            text-align: center; 
            background: #ffffff;
            border: 4px solid #b2ebf2;
            border-radius: 20px;
            padding: 15px 20px;
            max-width: 500px;
            width: 95%;
            max-height: 94vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .intro-card {
            background: #f8fafc; border: 2px solid #e2e8f0;
            border-radius: 12px; padding: 10px 15px; margin-bottom: 12px; width: 100%;
            text-align: left; box-sizing: border-box;
        }
        .intro-card h3 { margin: 0 0 6px 0; font-size: 16px; color: #1976d2; }
        .intro-card ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; color: #334155; }
        .intro-card li { margin-bottom: 4px; }

        #start-btn { 
            padding: 2.5vh 5vh; font-size: 3.5vh; background: #1976d2; color: white; 
            border: none; border-radius: 3vh; cursor: pointer; box-shadow: 0 1vh #0d47a1; 
            font-weight: bold; width: 100%; max-width: 240px; margin-bottom: 5px;
        }
        #start-btn:active { transform: translateY(3px); box-shadow: 0 0.5vh #0d47a1; }
        
        /* 遊戲介面樣式 */
        #game-ui { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: space-between; max-width: 580px; }
        #status-bar { display: flex; justify-content: space-around; width: 100%; font-size: 5vh; font-weight: bold; color: #2c3e50; padding: 1vh 0; border-bottom: 0.5vh solid #b2ebf2; }
        
        #visual-area { height: 25vh; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5vw; flex-wrap: wrap; background: #f8fafc; border-radius: 12px; border: 2px dashed #cbd5e1; }
        
        /* 火車車廂動畫樣式 */
        .train-car { font-size: 7vh; transition: transform 1.5s ease-in-out, opacity 1.5s ease-in-out; }
        .entering { transform: translateX(40vw); opacity: 0; }
        .exiting { transform: translateX(40vw); opacity: 0; }

        #equation { font-size: 7vh; font-weight: bold; color: #1565c0; margin: 5px 0; }
        #feedback { font-size: 5vh; color: #d84315; font-weight: bold; height: 6vh; }
        
        /* 俄羅斯方塊掉落答案區域 */
        #drop-game-container {
            position: relative;
            width: 100%;
            height: 150px;
            background: #f1f5f9;
            border: 3px solid #cbd5e1;
            border-radius: 14px;
            overflow: hidden;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        /* 掉落的方塊選項 */
        .falling-option {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #38bdf8 60%, #0284c7 100%);
            border: 3px solid #0369a1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: fall linear forwards;
            z-index: 999;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .falling-option:active { transform: scale(0.9); }

        @keyframes fall {
            0% { top: -70px; }
            100% { top: 75px; }
        }
    </style>
</head>
<body>

    <!-- 首頁畫面：包含使用說明書與捲動支援 -->
    <div id="home-screen">
        <h1 style="font-size: 4.5vh; color: #1976d2; margin-top: 5px; margin-bottom: 8px;">🚂 火車加減法遊戲</h1>
        
        <!-- 使用說明書卡片 -->
        <div class="intro-card">
            <h3>📖 遊戲使用說明書</h3>
            <ul>
                <li><strong>步驟一：觀察火車車廂：</strong>遊戲開始後，先看清楚畫面上原本有幾節火車車廂。</li>
                <li><strong>步驟二：加減 2 或 3：</strong>接著會有新車廂開進來（+2 或 +3）或是開走幾節車廂（-2 或 -3）。</li>
                <li><strong>步驟三：算出總數：</strong>思考現在一共有幾節車廂，或是還剩下幾節車廂。</li>
                <li><strong>步驟四：點擊數字方塊：</strong>當畫面上方掉落數字方塊時，點擊對應的正確答案方塊即可完成闖關！</li>
            </ul>
        </div>

        <button id="start-btn" onclick="initGame()">開始遊戲</button>
    </div>

    <div id="game-ui">
        <div id="status-bar">
            <div id="timer">時間: 00:00</div>
            <div id="score">闖關: 0</div>
        </div>
        <div id="visual-area"></div>
        <div id="equation">?</div>
        <div id="feedback">請觀察火車變化...</div>
        
        <!-- 俄羅斯方塊掉落答案區域 -->
        <div id="drop-game-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        let currentCount = 4, score = 0, startTime;
        let gameInterval = null;
        let activeOptions = [];
        let isAnswered = false;
        let currentAns = 0;
        let audioCtx = null;

        function initGame() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let unlockSpeech = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(unlockSpeech);

            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            startTime = Date.now();
            startTimer();
            playRound();
        }

        function startTimer() {
            setInterval(() => {
                let diff = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timer').innerText = `時間: ${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
            }, 1000);
        }

        function speakText(text, callback) {
            if (!window.speechSynthesis) {
                if (callback) callback();
                return;
            }
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.8;
            if (callback) {
                utterance.onend = callback;
            }
            window.speechSynthesis.speak(utterance);
        }

        async function playRound() {
            isAnswered = false;
            let area = document.getElementById('visual-area');
            let eq = document.getElementById('equation');
            let feedback = document.getElementById('feedback');
            
            activeOptions.forEach(el => el.remove());
            activeOptions = [];
            if (gameInterval) clearInterval(gameInterval);

            // 隨機選擇加法或減法，變動量改為 2 或 3
            let action = Math.random() > 0.5 ? 'add' : 'sub';
            let delta = Math.random() > 0.5 ? 2 : 3;

            // 確保車廂數量維持在合理的 2 到 10 之間
            if (currentCount >= 8) action = 'sub';
            if (currentCount <= 3) action = 'add';

            renderTrain(currentCount);
            feedback.innerText = "仔細看火車喔！";
            
            await new Promise(r => setTimeout(r, 1000));

            if (action === 'add') {
                let nextCount = currentCount + delta;
                eq.innerText = `${currentCount} + ${delta} = ?`;
                currentAns = nextCount;
                
                let promptText = `原本有 ${currentCount} 節車廂，開來了 ${delta} 節新車廂。`;
                feedback.innerText = promptText;
                
                speakText(promptText, async () => {
                    await new Promise(r => setTimeout(r, 500));
                    
                    // 動態加入 delta 節車廂
                    for(let i = 0; i < delta; i++) {
                        let t = document.createElement('div');
                        t.className = 'train-car entering';
                        t.innerText = '🚃';
                        area.appendChild(t);
                        await new Promise(r => setTimeout(r, 100));
                        t.classList.remove('entering');
                        await new Promise(r => setTimeout(r, 300));
                    }
                    
                    await new Promise(r => setTimeout(r, 1000));
                    currentCount = nextCount;
                    
                    let finalAsk = "現在一共有幾節車廂呢？方塊掉下來囉！";
                    feedback.innerText = finalAsk;
                    speakText(finalAsk);
                    startFallingOptions();
                });

            } else {
                let nextCount = currentCount - delta;
                eq.innerText = `${currentCount} - ${delta} = ?`;
                currentAns = nextCount;
                
                let promptText = `原本有 ${currentCount} 節車廂，開走了 ${delta} 節車廂。`;
                feedback.innerText = promptText;
                
                speakText(promptText, async () => {
                    await new Promise(r => setTimeout(r, 500));
                    
                    // 動態移除最後 delta 節車廂
                    for(let i = 0; i < delta; i++) {
                        let lastCar = area.lastElementChild;
                        if (lastCar) {
                            lastCar.classList.add('exiting');
                        }
                        await new Promise(r => setTimeout(r, 400));
                    }
                    
                    await new Promise(r => setTimeout(r, 1000));
                    currentCount = nextCount;
                    renderTrain(currentCount);
                    
                    let finalAsk = "現在還剩下幾節車廂呢？方塊掉下來囉！";
                    feedback.innerText = finalAsk;
                    speakText(finalAsk);
                    startFallingOptions();
                });
            }
        }

        function renderTrain(count) {
            let area = document.getElementById('visual-area');
            area.innerHTML = '';
            for(let i = 0; i < count; i++) {
                let t = document.createElement('div');
                t.className = 'train-car';
                t.innerText = '🚃';
                area.appendChild(t);
            }
        }

        function startFallingOptions() {
            let options = new Set([currentAns]);
            while(options.size < 4) {
                let rand = Math.floor(Math.random() * 10) + 1;
                options.add(rand);
            }
            let optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

            let index = 0;
            gameInterval = setInterval(() => {
                if (isAnswered) {
                    clearInterval(gameInterval);
                    return;
                }
                if (index >= optionsArr.length) index = 0;
                spawnFallingOption(optionsArr[index]);
                index++;
            }, 2000);
        }

        function spawnFallingOption(val) {
            if (isAnswered) return;
            const container = document.getElementById('drop-game-container');
            const el = document.createElement('div');
            el.className = 'falling-option';
            el.innerText = val;

            const randomX = Math.random() * (container.clientWidth - 70);
            el.style.left = randomX + 'px';
            const duration = 4 + Math.random();
            el.style.animationDuration = duration + 's';

            let isHandled = false;
            const handleSelect = function(e) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                if (isAnswered || isHandled) return;
                isHandled = true;

                if (val === currentAns) {
                    isAnswered = true;
                    document.getElementById('feedback').innerText = "太棒了！👍";
                    speakText("太棒了！");
                    confetti();
                    score++;
                    document.getElementById('score').innerText = `闖關: ${score}`;

                    clearInterval(gameInterval);
                    activeOptions.forEach(opt => opt.remove());
                    activeOptions = [];

                    setTimeout(playRound, 2500);
                } else {
                    speakText("再算算看喔！");
                    document.getElementById('feedback').innerText = "❌ 數字不對喔，再試一次！";
                    el.style.transition = "opacity 0.3s";
                    el.style.opacity = "0";
                    setTimeout(() => el.remove(), 300);
                }
            };

            el.addEventListener('click', handleSelect);
            el.addEventListener('touchstart', handleSelect, { passive: false });

            el.addEventListener('animationend', () => {
                el.remove();
                activeOptions = activeOptions.filter(item => item !== el);
            });

            container.appendChild(el);
            activeOptions.push(el);
        }
    </script>
</body>
</html>
