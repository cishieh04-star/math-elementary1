<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10以內的加法遊戲(間隔1)</title>
    <!-- 引入灑花特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #fdfbf7, #fef3c7); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 10px; 
            font-family: "Microsoft JhengHei", sans-serif; 
            overflow: hidden; 
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .main-wrapper {
            width: 100%;
            max-width: 550px;
            max-height: 98vh;
            background: #ffffff;
            border: 4px solid #cbd5e1;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* 💡 保持原介面風格，並加入內部捲動與適當內距，確保在所有裝置上都能完整看到全貌 */
        #home-screen { 
            text-align: center; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: center; 
            max-height: 90vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        #game-ui { 
            text-align: center; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }

        .intro-card {
            background: #f8fafc; border: 2px solid #e2e8f0;
            border-radius: 12px; padding: 10px 15px; margin-bottom: 12px; width: 100%;
            text-align: left; box-sizing: border-box;
        }
        .intro-card h3 { margin: 0 0 6px 0; font-size: 16px; color: #d97706; }
        .intro-card ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; color: #334155; }
        .intro-card li { margin-bottom: 4px; }
        
        #status-bar { 
            display: flex; 
            justify-content: space-around; 
            width: 100%; 
            font-size: 20px; 
            font-weight: bold; 
            color: #2c3e50; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 8px; 
            margin-bottom: 8px;
        }
        
        #visual-area { 
            height: 110px; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            flex-wrap: wrap; 
            overflow-y: auto;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            padding: 5px;
            box-sizing: border-box;
        }
        .dot { width: 30px; height: 30px; background: #ffaa55; border-radius: 50%; box-shadow: 1px 1px 3px rgba(0,0,0,0.2); }
        .symbol { font-size: 32px; font-weight: bold; color: #555; padding: 0 5px; }
        
        #question { font-size: 36px; font-weight: bold; color: #333; margin: 5px 0; }
        #feedback { font-size: 22px; color: #e67e22; font-weight: bold; min-height: 30px; margin: 5px 0; }
        
        /* 掉落答案遊戲區域 */
        #drop-game-container {
            position: relative;
            width: 100%;
            height: 160px;
            background: #f1f5f9;
            border: 3px solid #cbd5e1;
            border-radius: 14px;
            overflow: hidden;
            box-sizing: border-box;
            margin-top: 5px;
        }

        /* 從上往下掉落的選項球 */
        .falling-option {
            position: absolute;
            width: 75px;
            height: 75px;
            background: radial-gradient(circle, #fde047 60%, #eab308 100%);
            border: 3px solid #ca8a04;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #78350f;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: fall linear forwards;
            z-index: 999;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .falling-option:active { transform: scale(0.9); }

        @keyframes fall {
            0% { top: -75px; }
            100% { top: 90px; }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button#start-btn, .control-btn { 
            padding: 15px 40px; 
            font-size: 22px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(59,130,246,0.3);
            font-weight: bold;
            touch-action: manipulation;
            z-index: 10;
        }
        button#start-btn:active, .control-btn:active { background: #2563eb; transform: scale(0.95); }
        
        #pause-btn {
            background: #d97706;
        }
        #pause-btn:active {
            background: #b45309;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- 首頁畫面：包含使用說明書與捲動支援 -->
    <div id="home-screen">
        <h1 style="font-size: 34px; color: #1e293b; margin-bottom: 5px;">🌟 簡單加法冒險遊戲</h1>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 12px;">點擊掉落的正確答案，一起來快樂闖關！</p>
        
        <!-- 使用說明書卡片 -->
        <div class="intro-card">
            <h3>📖 遊戲使用說明書</h3>
            <ul>
                <li><strong>步驟一：觀察加法算式：</strong>遊戲開始後，先看清楚畫面上方顯示的數字與圖示（例如圓點數量相加）。</li>
                <li><strong>步驟二：心算總和：</strong>動腦計算出兩個數字相加起來的正確總和。</li>
                <li><strong>步驟三：點擊掉落答案球：</strong>當畫面上方掉落黃色數字球時，用手指點擊對應的正確答案即可完成闖關！</li>
                <li><strong>步驟四：貼心暫停功能：</strong>闖關過程中如果需要休息，可隨時點擊下方的「暫停遊戲」按鈕。</li>
            </ul>
        </div>

        <button id="start-btn" type="button">開始玩遊戲</button>
    </div>

    <!-- 遊戲中畫面 -->
    <div id="game-ui" style="display: none;">
        <div id="status-bar">
            <div id="timer">時間: 00:00</div>
            <div id="score">闖關: 0</div>
        </div>
        
        <div id="visual-area"></div>
        <div id="question">? + ? = ?</div>
        <div id="feedback">準備好了嗎？答案掉下來囉！</div>
        
        <!-- 掉落答案區域 -->
        <div id="drop-game-container"></div>

        <!-- 暫停按鈕區 -->
        <div class="btn-group">
            <button id="pause-btn" class="control-btn" type="button">暫停遊戲</button>
        </div>
    </div>
</div>

    <script>
        let currentAns, n1, n2, score = 0;
        let gameInterval = null;
        let nextQuestionTimeout = null; 
        let activeOptions = [];
        let isAnswered = false;
        let isPaused = false;
        let timerInterval = null;
        let totalSeconds = 0; 
        let audioCtx = null;
        let optionsArr = [];

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-TW';
            
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => v.lang.includes('zh-TW') && (v.name.includes('Mei-Jia') || v.name.toLowerCase().includes('female')));
            if (femaleVoice) msg.voice = femaleVoice;
            
            window.speechSynthesis.speak(msg);
        }

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }

        function playSuccessSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.15); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);  
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.45); 

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.7);
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        function playErrorSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        function initGame(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                let unlockSpeech = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockSpeech);
            } catch (err) {
                console.log("Audio init error:", err);
            }

            const homeScreen = document.getElementById('home-screen');
            const gameUi = document.getElementById('game-ui');
            if (homeScreen) homeScreen.style.display = 'none';
            if (gameUi) gameUi.style.display = 'flex';

            score = 0;
            totalSeconds = 0;
            isPaused = false;
            
            const pauseBtn = document.getElementById('pause-btn');
            if (pauseBtn) {
                pauseBtn.innerText = "暫停遊戲";
                pauseBtn.style.backgroundColor = "#d97706";
            }

            const scoreEl = document.getElementById('score');
            if (scoreEl) scoreEl.innerText = `闖關: ${score}`;

            startTimer();
            loadQuestion();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    totalSeconds++;
                    let m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                    let s = (totalSeconds % 60).toString().padStart(2, '0');
                    const timerEl = document.getElementById('timer');
                    if (timerEl) timerEl.innerText = `時間: ${m}:${s}`;
                }
            }, 1000);
        }

        function togglePause(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            
            if (isPaused) {
                if (pauseBtn) {
                    pauseBtn.innerText = "繼續遊戲";
                    pauseBtn.style.backgroundColor = "#16a34a";
                }
                const feedbackEl = document.getElementById('feedback');
                if (feedbackEl) feedbackEl.innerText = "⏸️ 遊戲已暫停，慢慢思考喔！";
                activeOptions.forEach(el => {
                    el.style.animationPlayState = 'paused';
                });
            } else {
                if (pauseBtn) {
                    pauseBtn.innerText = "暫停遊戲";
                    pauseBtn.style.backgroundColor = "#d97706";
                }
                const feedbackEl = document.getElementById('feedback');
                if (feedbackEl) feedbackEl.innerText = "▶️ 遊戲繼續！加油！";
                activeOptions.forEach(el => {
                    el.style.animationPlayState = 'running';
                });
                
                if (isAnswered) {
                    loadQuestion();
                }
            }
        }

        function loadQuestion() {
            isAnswered = false;
            if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);

            if (!isPaused) {
                const feedbackEl = document.getElementById('feedback');
                if (feedbackEl) feedbackEl.innerText = "注意看！答案掉下來囉！";
            }
            
            activeOptions.forEach(el => el.remove());
            activeOptions = [];
            if (gameInterval) clearInterval(gameInterval);

            if (Math.random() > 0.5) { n1 = Math.floor(Math.random() * 9) + 1; n2 = 1; }
            else { n1 = 1; n2 = Math.floor(Math.random() * 9) + 1; }
            currentAns = n1 + n2;
            
            const qEl = document.getElementById('question');
            if (qEl) qEl.innerText = `${n1} + ${n2} = ?`;
            renderDots(n1, n2);

            speak(`${n1} 加 ${n2} 等於多少？`);

            let options = new Set([currentAns]);
            while(options.size < 4) options.add(Math.floor(Math.random() * 10) + 2);
            optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

            let index = 0;
            gameInterval = setInterval(() => {
                if (isPaused) return; 
                if (isAnswered) {
                    clearInterval(gameInterval);
                    return;
                }
                
                if (index >= optionsArr.length) {
                    index = 0;
                }

                spawnFallingOption(optionsArr[index]);
                index++;
            }, 1800);
        }

        function spawnFallingOption(val) {
            if (isAnswered) return;
            const container = document.getElementById('drop-game-container');
            if (!container) return;

            const el = document.createElement('div');
            el.className = 'falling-option';
            el.innerText = val;

            const randomX = Math.random() * (container.clientWidth - 75);
            el.style.left = randomX + 'px';
            
            const duration = 3.5 + Math.random();
            el.style.animationDuration = duration + 's';

            if (isPaused) {
                el.style.animationPlayState = 'paused';
            }

            let isHandled = false;
            const handleSelect = function(e) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                if (isAnswered || isPaused || isHandled) return;
                isHandled = true;

                if (val === currentAns) {
                    isAnswered = true;
                    score++;
                    const scoreEl = document.getElementById('score');
                    if (scoreEl) scoreEl.innerText = `闖關: ${score}`;
                    
                    playSuccessSound();
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

                    const qEl = document.getElementById('question');
                    if (qEl) qEl.innerText = `${n1} + ${n2} = ${currentAns}`;
                    const feedbackEl = document.getElementById('feedback');
                    if (feedbackEl) feedbackEl.innerText = "🎉 太棒了！答對囉！";
                    renderResultDots(currentAns);
                    
                    speak(`答案是${currentAns}，太棒了！`);

                    clearInterval(gameInterval);
                    activeOptions.forEach(opt => opt.remove());
                    activeOptions = [];

                    nextQuestionTimeout = setTimeout(() => {
                        if (!isPaused) loadQuestion();
                    }, 3000);
                } else {
                    playErrorSound();
                    speak("再算算看喔！");
                    const feedbackEl = document.getElementById('feedback');
                    if (feedbackEl) feedbackEl.innerText = "❌ 答錯囉，找找看正確的數字！";
                    
                    el.style.transition = "opacity 0.3s";
                    el.style.opacity = "0";
                    setTimeout(() => el.remove(), 300);
                }
            };

            el.addEventListener('click', handleSelect);
            el.addEventListener('touchstart', handleSelect, { passive: false });

            el.addEventListener('animationend', () => {
                el.remove();
                activeOptions = activeOptions.filter(item => item !== el);
            });

            container.appendChild(el);
            activeOptions.push(el);
        }

        function renderDots(num1, num2) {
            let area = document.getElementById('visual-area');
            if (!area) return;
            area.innerHTML = '';
            for(let i=0; i<num1; i++) area.appendChild(createDot());
            let sym = document.createElement('span');
            sym.className = 'symbol';
            sym.innerText = '+';
            area.appendChild(sym);
            for(let i=0; i<num2; i++) area.appendChild(createDot());
        }

        function renderResultDots(res) {
            let area = document.getElementById('visual-area');
            if (!area) return;
            area.innerHTML = '';
            for(let i=0; i<res; i++) area.appendChild(createDot());
        }

        function createDot() {
            let d = document.createElement('div');
            d.className = 'dot';
            return d;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-btn');
            const pauseBtn = document.getElementById('pause-btn');

            if (startBtn) {
                startBtn.addEventListener('click', initGame);
                startBtn.addEventListener('touchstart', initGame, { passive: false });
            }

            if (pauseBtn) {
                pauseBtn.addEventListener('click', togglePause);
                pauseBtn.addEventListener('touchstart', togglePause, { passive: false });
            }
        });
    </script>
</body>
</html>
