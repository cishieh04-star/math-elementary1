<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>九九乘法互動遊戲 (含暫停按鈕版)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background-color: #fdf5e6; 
            margin: 0; 
            padding: 5px; 
            min-height: 100vh; 
            min-height: calc(100vh - env(safe-area-inset-bottom));
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden; 
            overflow-y: auto;
            touch-action: manipulation; 
        }
        h1 { color: #333; font-size: 22px; margin: 4px 0; }
        
        /* 💡 保持原介面風格，並加入內部捲動，確保在所有裝置上都能看到全貌 */
        #startScreen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            background-color: #fdf5e6; z-index: 9999; 
            overflow-y: auto; padding: 30px 20px; text-align: left;
        }
        .start-content-box {
            max-width: 500px; width: 100%; display: flex; flex-direction: column; align-items: center; margin: auto 0;
        }
        
        .intro-card {
            background: #ffffff; border: 2px solid #f6ad55;
            border-radius: 15px; padding: 12px 18px; margin-bottom: 20px; width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .intro-card h3 { margin: 0 0 8px 0; font-size: 16px; color: #c05621; text-align: left; }
        .intro-card ul { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.6; color: #2d3748; text-align: left; }
        .intro-card li { margin-bottom: 6px; }

        .start-btn { 
            padding: 16px 36px; font-size: 26px; font-weight: bold; background-color: #ff7f50; color: white; 
            border: none; border-radius: 20px; cursor: pointer; box-shadow: 0px 5px 15px rgba(0,0,0,0.2); 
            width: 100%; max-width: 280px; text-align: center; margin-bottom: 10px;
        }
        .start-btn:active { transform: scale(0.95); }
        
        #gameScreen { 
            display: none; 
            width: 100%; 
            max-width: 580px; 
            min-height: 92vh;
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            background: #fff; 
            border-radius: 20px; 
            border: 3px solid #ff7f50;
            padding: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            margin: auto;
            position: relative;
        }

        .status-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            width: 100%; font-size: 16px; font-weight: bold; color: #c05621; 
            border-bottom: 2px solid #fdf5e6; padding-bottom: 6px; margin-bottom: 10px;
        }

        .control-btn {
            background-color: #ff7f50; color: white; border: none; border-radius: 10px;
            padding: 6px 14px; font-size: 14px; font-weight: bold; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .control-btn:active { transform: scale(0.95); background-color: #e66738; }

        .question-box {
            font-size: 42px; font-weight: bold; color: #2d3748; margin: 15px 0;
            background: #fffaf0; padding: 15px 30px; border-radius: 15px; border: 2px dashed #f6ad55;
            width: 100%; max-width: 350px;
        }

        #drop-game-container {
            position: relative; width: 100%; height: 140px;
            background: #fff8dc; border: 2px solid #f6ad55; border-radius: 12px;
            overflow: hidden; touch-action: manipulation; margin-top: 10px;
        }

        .falling-option {
            position: absolute; width: 65px; height: 65px;
            background: radial-gradient(circle, #ffeb3b 60%, #ff9800 100%);
            border: 3px solid #f57c00; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: bold; color: #78350f;
            cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: fall linear forwards; z-index: 999;
        }
        .falling-option:active { transform: scale(0.9); }

        @keyframes fall {
            0% { top: -65px; }
            100% { top: 75px; }
        }

        #feedback { font-size: 20px; color: #e67e22; font-weight: bold; min-height: 30px; margin: 8px 0; }
    </style>
</head>
<body>

    <!-- 首頁畫面：包含使用說明書與捲動支援 -->
    <div id="startScreen">
        <div class="start-content-box">
            <h1 style="color: #c05621; font-size: 28px; margin-bottom: 15px; text-align: center;">🍎 九九乘法互動遊戲</h1>
            
            <!-- 使用說明卡片 -->
            <div class="intro-card">
                <h3>📖 遊戲使用說明書</h3>
                <ul>
                    <li><strong>步驟一：查看題目：</strong>進入遊戲後，畫面上方會出現九九乘法算式（例如 3 × 4 = ?）。</li>
                    <li><strong>步驟二：心算答案：</strong>動腦計算出正確的相乘結果。</li>
                    <li><strong>步驟三：點擊掉落數字球：</strong>當畫面上方掉落數字球時，用手指點擊對應的正確答案來完成闖關！</li>
                    <li><strong>貼心暫停功能：</strong>遊戲過程中如果需要休息，可隨時點擊右上角的「暫停」按鈕。</li>
                </ul>
            </div>

            <button class="start-btn" onclick="startGame()">▶ 開始遊戲</button>
        </div>
    </div>

    <!-- 遊戲主畫面 -->
    <div id="gameScreen">
        <h1>九九乘法互動遊戲</h1>
        <div class="status-bar">
            <div id="score">已完成: 0 關</div>
            <button class="control-btn" id="pauseBtn" onclick="togglePause()">暫停</button>
        </div>

        <div class="question-box" id="questionBox">3 × 4 = ?</div>
        <div id="feedback">請選出正確的答案！</div>

        <div id="drop-game-container"></div>
    </div>

    <script>
        let score = 0;
        let num1 = 3, num2 = 4, currentAns = 12;
        let gameInterval = null;
        let activeOptions = [];
        let isAnswered = false;
        let isPaused = false;
        let audioCtx = null;

        function speak(text) {
            if (isPaused || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-TW';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        function startGame() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (window.speechSynthesis) {
                let unlockSpeech = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockSpeech);
            }

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            score = 0;
            isPaused = false;
            document.getElementById('score').innerText = `已完成: ${score} 關`;
            nextQuestion();
        }

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            const options = document.querySelectorAll('.falling-option');

            if (isPaused) {
                pauseBtn.innerText = "繼續";
                pauseBtn.style.backgroundColor = "#16a34a";
                if (gameInterval) clearInterval(gameInterval);
                window.speechSynthesis.cancel();
                options.forEach(el => el.style.animationPlayState = 'paused');
                document.getElementById('feedback').innerText = "⏸️ 遊戲已暫停";
            } else {
                pauseBtn.innerText = "暫停";
                pauseBtn.style.backgroundColor = "#ff7f50";
                options.forEach(el => el.style.animationPlayState = 'running');
                document.getElementById('feedback').innerText = "請選出正確的答案！";
                if (!isAnswered) {
                    startFallingOptions();
                }
            }
        }

        function nextQuestion() {
            isAnswered = false;
            activeOptions.forEach(el => el.remove());
            activeOptions = [];
            if (gameInterval) clearInterval(gameInterval);

            num1 = Math.floor(Math.random() * 8) + 2; // 2~9
            num2 = Math.floor(Math.random() * 8) + 2; // 2~9
            currentAns = num1 * num2;

            document.getElementById('questionBox').innerText = `${num1} × ${num2} = ?`;
            document.getElementById('feedback').innerText = "請選出正確的答案！";
            speak(`${num1}乘${num2}等於多少呢？`);

            startFallingOptions();
        }

        function startFallingOptions() {
            let options = new Set([currentAns]);
            while(options.size < 4) {
                let r1 = Math.floor(Math.random() * 8) + 2;
                let r2 = Math.floor(Math.random() * 8) + 2;
                options.add(r1 * r2);
            }
            let optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

            let index = 0;
            gameInterval = setInterval(() => {
                if (isPaused || isAnswered) return;
                if (index >= optionsArr.length) index = 0;
                spawnFallingOption(optionsArr[index]);
                index++;
            }, 2000);
        }

        function spawnFallingOption(val) {
            if (isAnswered || isPaused) return;
            const container = document.getElementById('drop-game-container');
            const el = document.createElement('div');
            el.className = 'falling-option';
            el.innerText = val;

            const randomX = Math.random() * (container.clientWidth - 65);
            el.style.left = randomX + 'px';
            const duration = 4 + Math.random();
            el.style.animationDuration = duration + 's';

            let isHandled = false;
            const handleSelect = function(e) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                if (isAnswered || isPaused || isHandled) return;
                isHandled = true;

                if (val === currentAns) {
                    isAnswered = true;
                    score++;
                    document.getElementById('score').innerText = `已完成: ${score} 關`;
                    document.getElementById('feedback').innerText = "🎉 答對了！太棒囉！";
                    speak(`答對了，就是${currentAns}！`);
                    confetti();

                    clearInterval(gameInterval);
                    activeOptions.forEach(opt => opt.remove());
                    activeOptions = [];

                    setTimeout(() => {
                        if (!isPaused) nextQuestion();
                    }, 2500);
                } else {
                    isHandled = true;
                    speak("再算算看喔！");
                    document.getElementById('feedback').innerText = "❌ 數字不對喔，再試一次！";
                    el.style.transition = "opacity 0.3s";
                    el.style.opacity = "0";
                    setTimeout(() => el.remove(), 300);
                }
            };

            el.addEventListener('click', handleSelect);
            el.addEventListener('touchstart', handleSelect, { passive: false });

            el.addEventListener('animationend', () => {
                el.remove();
                activeOptions = activeOptions.filter(item => item !== el);
            });

            container.appendChild(el);
            activeOptions.push(el);
        }
    </script>
</body>
</html>
