<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>九九乘法互動遊戲 (含暫停按鈕版)</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background-color: #fdf5e6; 
            margin: 0; 
            padding: 5px; 
            min-height: 100vh; 
            min-height: calc(100vh - env(safe-area-inset-bottom));
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden; 
            overflow-y: auto;
            touch-action: manipulation; 
        }
        h1 { color: #333; font-size: 22px; margin: 4px 0; }
        
        #startScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #fdf5e6; z-index: 9999; }
        .start-btn { padding: 18px 36px; font-size: 28px; font-weight: bold; background-color: #ff7f50; color: white; border-radius: 20px; cursor: pointer; box-shadow: 0px 5px 15px rgba(0,0,0,0.2); }
        
        #gameScreen { 
            display: none; 
            width: 100%; 
            max-width: 580px; 
            min-height: 92vh;
            flex-direction: column; 
            align-items: center; 
            justify-content: space-evenly; 
            background: #fff; 
            border-radius: 18px; 
            border: 3px solid #ffa07a; 
            padding: 8px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            margin: auto;
        }
        
        /* 狀態列 (含闖關次數統計與暫停按鈕) */
        .status-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold; 
            color: #2c3e50; 
            border-bottom: 2px solid #f3e5ab; 
            padding-bottom: 4px; 
            padding-left: 5px;
            padding-right: 5px;
        }

        .status-left { display: flex; gap: 15px; align-items: center; }

        /* 暫停按鈕樣式 */
        .pause-btn {
            font-size: 15px; font-weight: bold; padding: 6px 14px;
            background: #f59e0b; color: white; border: none; border-radius: 8px;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .pause-btn:active { transform: scale(0.95); }

        .equation-container { display: flex; justify-content: center; align-items: center; font-size: 32px; margin: 2px 0; font-weight: bold; }
        .concept-text { font-size: 17px; color: #d2691e; margin-bottom: 2px; font-weight: bold; min-height: 24px; }
        
        .visual-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 75px; align-items: center; }
        .group-box { border: 2px solid #ffa07a; border-radius: 8px; padding: 3px; display: grid; gap: 2px; background-color: #fff; align-content: center; width: 45px; height: 68px; }
        .dot { height: 10px; width: 10px; background-color: #ff6347; border-radius: 50%; }
        .box { width: 80px; height: 50px; border: 3px dashed #333; display: flex; align-items: center; justify-content: center; background: white; margin: 0 6px; border-radius: 8px; font-size: 28px; }
        
        #drop-game-container {
            position: relative;
            width: 100%;
            height: 130px;
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            overflow: hidden;
            touch-action: none;
        }

        .falling-option {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #98fb98 60%, #3cb371 100%);
            border: 3px solid #2e8b57;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #1b4d3e;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            animation: fall linear forwards;
            z-index: 999;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .falling-option:active { transform: scale(0.9); }

        @keyframes fall {
            0% { top: -65px; }
            100% { top: 70px; }
        }

        @keyframes confetti-fall {
            0% { transform: translateY(0vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .confetti { position: absolute; width: 10px; height: 10px; z-index: 999; top: -10px; animation: confetti-fall 1.5s linear forwards; }
    </style>
</head>
<body>

    <div id="startScreen">
        <h1>九九乘法互動遊戲</h1>
        <div class="start-btn" id="startBtn">開始遊戲</div>
    </div>

    <div id="gameScreen">
        <h1>九九乘法互動遊戲</h1>
        <div class="status-bar">
            <div class="status-left">
                <div id="timer">時間: 00:00</div>
                <div id="score">已完成: 0 關</div>
            </div>
            <!-- 暫停按鈕 -->
            <button class="pause-btn" id="pauseBtn" onclick="togglePause()">⏸ 暫停</button>
        </div>
        <div id="visualArea" class="visual-area"></div>
        <div class="equation-container">
            <span id="equationDisplay">4 × 4 ＝</span>
            <div class="box" id="dropTarget">?</div>
        </div>
        <div class="concept-text" id="conceptText"></div>
        
        <!-- 俄羅斯方塊掉落區 -->
        <div id="drop-game-container"></div>
    </div>

    <script>
        let isProcessing = false; 
        let score = 0;
        let totalSeconds = 0;
        let timerInterval = null;
        let gameInterval = null;
        let activeOptions = [];
        let currentProduct = 0;
        let isPaused = false;

        let preferredVoice = null;
        function loadVoices() {
            let voices = window.speechSynthesis.getVoices();
            if (!voices || voices.length === 0) return;

            preferredVoice = voices.find(v => 
                (v.lang === 'zh-TW' || v.lang === 'zh-HK' || v.lang === 'zh-CN') && 
                (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('woman') || v.name.includes('女') || v.name.includes('Yating') || v.name.includes('Meijia') || v.name.includes('Xiaoxiao'))
            );
            
            if (!preferredVoice) {
                preferredVoice = voices.find(v => v.lang === 'zh-TW');
            }
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); 

        function speak(text) {
            window.speechSynthesis.cancel(); 
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-TW';
            msg.rate = 0.85; 
            if (preferredVoice) {
                msg.voice = preferredVoice;
            }
            window.speechSynthesis.speak(msg);
        }

        function triggerConfetti() {
            for (let i = 0; i < 40; i++) {
                let c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = ['#f00', '#0f0', '#00f', '#ff0', '#f0f'][Math.floor(Math.random()*5)];
                c.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 2500); 
            }
        }

        document.getElementById('startBtn').onclick = () => {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            score = 0;
            totalSeconds = 0;
            isPaused = false;
            document.getElementById('pauseBtn').innerText = "⏸ 暫停";
            document.getElementById('pauseBtn').style.background = "#f59e0b";
            startTimer();
            generateQuestion();
        };

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    totalSeconds++;
                    let m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                    let s = (totalSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('timer').innerText = `時間: ${m}:${s}`;
                }
            }, 1000);
        }

        // 暫停與繼續切換邏輯
        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            const conceptText = document.getElementById('conceptText');

            if (isPaused) {
                pauseBtn.innerText = "▶ 繼續";
                pauseBtn.style.background = "#16a34a";
                conceptText.innerText = "⏸️ 遊戲已暫停，可以慢慢思考喔！";
                activeOptions.forEach(el => el.style.animationPlayState = 'paused');
            } else {
                pauseBtn.innerText = "⏸ 暫停";
                pauseBtn.style.background = "#f59e0b";
                conceptText.innerText = `（ ${currentNumB} 個 ${currentNumA} ）`; // 恢復提示
                activeOptions.forEach(el => el.style.animationPlayState = 'running');
            }
        }

        let currentNumA = 4, currentNumB = 4;

        function generateQuestion() {
            if (isPaused) return;
            isProcessing = false;
            document.getElementById('dropTarget').innerHTML = '?';
            
            activeOptions.forEach(el => el.remove());
            activeOptions = [];
            if (gameInterval) clearInterval(gameInterval);

            currentNumA = Math.floor(Math.random() * 8) + 2; 
            currentNumB = Math.floor(Math.random() * 8) + 2;
            currentProduct = currentNumA * currentNumB;
            
            document.getElementById('equationDisplay').innerText = `${currentNumA} × ${currentNumB} ＝`;
            document.getElementById('conceptText').innerText = `（ ${currentNumB} 個 ${currentNumA} ）`;

            let visualHTML = '';
            for(let i = 0; i < currentNumB; i++) { 
                visualHTML += `<div class="group-box" style="grid-template-columns: repeat(2, 1fr);">`;
                for(let j = 0; j < currentNumA; j++) { visualHTML += `<div class="dot"></div>`; }
                visualHTML += `</div>`;
            }
            document.getElementById('visualArea').innerHTML = visualHTML;

            speak(`${currentNumA} 乘以 ${currentNumB}，等於多少呢？`);

            let options = [currentProduct];
            while(options.length < 6) {
                let ans = (Math.floor(Math.random() * 8) + 2) * (Math.floor(Math.random() * 8) + 2);
                if(!options.includes(ans)) options.push(ans);
            }
            options.sort(() => Math.random() - 0.5);

            let index = 0;
            gameInterval = setInterval(() => {
                if (isProcessing || isPaused) return;
                if (index >= options.length) index = 0;
                spawnFallingOption(options[index]);
                index++;
            }, 2000);
        }

        function spawnFallingOption(val) {
            if (isProcessing || isPaused) return;
            const container = document.getElementById('drop-game-container');
            const el = document.createElement('div');
            el.className = 'falling-option';
            el.innerText = val;

            const randomX = Math.random() * (container.clientWidth - 60);
            el.style.left = randomX + 'px';
            const duration = 4.5 + Math.random(); 
            el.style.animationDuration = duration + 's';

            if (isPaused) el.style.animationPlayState = 'paused';

            let isHandled = false;
            const handleSelect = function(e) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                if (isProcessing || isHandled || isPaused) return;

                if (val === currentProduct) {
                    isProcessing = true; 
                    isHandled = true;
                    document.getElementById('dropTarget').innerText = val;
                    
                    score++;
                    document.getElementById('score').innerText = `已完成: ${score} 關`;

                    triggerConfetti();
                    speak(`太棒了！${val}。你答對了！`);
                    
                    if (gameInterval) clearInterval(gameInterval);
                    activeOptions.forEach(opt => opt.remove());
                    activeOptions = [];

                    setTimeout(() => {
                        if (!isPaused) generateQuestion();
                    }, 3000);

                } else {
                    isHandled = true;
                    speak("再試試看喔！");
                    el.style.transition = "opacity 0.3s";
                    el.style.opacity = "0";
                    setTimeout(() => el.remove(), 300);
                }
            };

            el.addEventListener('click', handleSelect);
            el.addEventListener('touchstart', handleSelect, { passive: false });

            el.addEventListener('animationend', () => {
                el.remove();
                activeOptions = activeOptions.filter(item => item !== el);
            });

            container.appendChild(el);
            activeOptions.push(el);
        }
    </script>
</body>
</html>
