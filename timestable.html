<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>九九乘法互動遊戲</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background-color: #fdf5e6; 
            margin: 0; 
            padding: 5px; 
            min-height: 100vh; 
            min-height: calc(100vh - env(safe-area-inset-bottom));
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden; 
            overflow-y: auto;
            touch-action: manipulation; 
        }
        h1 { color: #333; font-size: 22px; margin: 4px 0; }
        
        /* 💡 保持原介面風格，並加入內部捲動與齊全內距，確保在所有裝置上都能看到全貌 */
        #startScreen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            background-color: #fdf5e6; z-index: 9999; 
            overflow-y: auto; padding: 30px 20px; text-align: left;
        }
        .start-content-box {
            max-width: 500px; width: 100%; display: flex; flex-direction: column; align-items: center; margin: auto 0;
        }
        
        .intro-card {
            background: #ffffff; border: 2px solid #f6ad55;
            border-radius: 15px; padding: 12px 18px; margin-bottom: 20px; width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .intro-card h3 { margin: 0 0 8px 0; font-size: 16px; color: #c05621; text-align: left; }
        .intro-card ul { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.6; color: #2d3748; text-align: left; }
        .intro-card li { margin-bottom: 6px; }

        .start-btn { 
            padding: 16px 36px; font-size: 26px; font-weight: bold; background-color: #ff7f50; color: white; 
            border: none; border-radius: 20px; cursor: pointer; box-shadow: 0px 5px 15px rgba(0,0,0,0.2); 
            width: 100%; max-width: 280px; text-align: center; margin-bottom: 10px;
        }
        .start-btn:active { transform: scale(0.95); }
        
        #gameScreen { 
            display: none; 
            width: 100%; 
            max-width: 580px; 
            min-height: 92vh;
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between;
            background: #fff; border-radius: 20px; padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto;
        }
    </style>
</head>
<body>

    <!-- 首頁畫面：包含使用說明書與捲動支援 -->
    <div id="startScreen">
        <div class="start-content-box">
            <h1 style="color: #c05621; font-size: 28px; margin-bottom: 15px; text-align: center;">🍎 九九乘法互動遊戲</h1>
            
            <!-- 使用說明卡片 -->
            <div class="intro-card">
                <h3>📖 遊戲使用說明書</h3>
                <ul>
                    <li><strong>步驟一：查看題目：</strong>進入遊戲後，畫面上會出現九九乘法算式（例如 3 × 4 = ?）。</li>
                    <li><strong>步驟二：心算答案：</strong>動腦計算出正確的乘法相乘結果。</li>
                    <li><strong>步驟三：點擊或選擇答案：</strong>根據遊戲互動方式選出正確答案來完成闖關！</li>
                    <li><strong>貼心暫停功能：</strong>遊戲過程中如果需要想想或休息，可隨時點擊畫面中的「暫停」按鈕。</li>
                </ul>
            </div>

            <button class="start-btn" onclick="startGame()">▶ 開始遊戲</button>
        </div>
    </div>

    <div id="gameScreen">
        <h1>九九乘法互動遊戲</h1>
        <p>遊戲內容載入中...</p>
    </div>

    <script>
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
        }
    </script>
</body>
</html>
